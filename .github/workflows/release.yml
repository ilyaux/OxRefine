# A tag like v0.5.0 builds the desktop installers (Windows, macOS, Linux) with their auto-update
# files, and the `ox` command line for each platform, into a draft GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Version and same-commit CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      release-body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release checks
        run: node --test tests/release/*.test.mjs
      - name: Require a matching version tag and successful main CI
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release-preflight.mjs

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: OxRefine __VERSION__
          releaseBody: ${{ needs.preflight.outputs.release-body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  cli:
    name: Command line (${{ matrix.target }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # static: runs on Alpine and on older glibc systems such as RHEL/Alma 8. Built on 24.04:
          # 22.04's musl-gcc ignores -static-pie and links ld-musl dynamically.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # `ox serve` carries the browser app, so build it first
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build ox
        env:
          # link with musl's own libraries; the host cc would pull in glibc's static libm
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p ox-cli --target ${{ matrix.target }}
      - name: Run the static build on Alpine and Alma Linux 8
        if: endsWith(matrix.target, '-musl')
        run: bash tools/smoke-static.sh target/${{ matrix.target }}/release/ox
      - name: Package and attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=ox-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$dir"
          cp README.md "$dir/"
          node tools/package-licenses.mjs "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ox.exe "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
            gh release upload "$GITHUB_REF_NAME" "$dir.zip" --clobber
          else
            cp target/${{ matrix.target }}/release/ox "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            gh release upload "$GITHUB_REF_NAME" "$dir.tar.gz" --clobber
          fi
