# A tag like v0.5.0 builds the desktop installers (Windows, macOS, Linux) with their auto-update
# files, and the `ox` command line for each platform, into a draft GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: OxRefine __VERSION__
          releaseBody: See the notes below for what's in this release.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  cli:
    name: Command line (${{ matrix.target }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # `ox serve` carries the browser app, so build it first
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build ox
        run: cargo build --release --locked -p ox-cli --target ${{ matrix.target }}
      - name: Package and attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=ox-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$dir"
          cp README.md LICENSE NOTICE "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ox.exe "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
            gh release upload "$GITHUB_REF_NAME" "$dir.zip" --clobber
          else
            cp target/${{ matrix.target }}/release/ox "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            gh release upload "$GITHUB_REF_NAME" "$dir.tar.gz" --clobber
          fi
