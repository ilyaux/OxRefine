# Build and test on Windows, macOS and Linux: unit tests plus the OpenRefine conformance suites
# (GREL, operations, facets, import, sources, the messy-data corpus, exports), which compare against
# fixtures generated from OpenRefine 3.10.1 and committed under tests/. Then typecheck and build the UI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the desktop crate (ui/src-tauri) is not a default member; it needs the UI build and system WebView libraries
      - name: Build
        run: cargo build --release --locked
      - name: Tests and OpenRefine conformance
        run: cargo test --profile ci --locked

  ui:
    name: UI typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Node regression tests
        run: node --test tests/*.test.mjs ../benchmarks/*.test.mjs ../tests/release/*.test.mjs ../tools/*.test.mjs
      - run: npm run build

  static:
    # one self-contained ox for Linux systems the glibc build can't start on (Alpine, RHEL/Alma 8)
    name: Static Linux build (Alpine, Alma Linux 8)
    # the same runner as the release's static build (22.04's musl-gcc can't link static-pie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the web UI goes into the binary; the proxy check below loads it
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build ox
        env:
          # link with musl's own libraries; the host cc would pull in glibc's static libm
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p ox-cli --target x86_64-unknown-linux-musl
      - name: Run it on Alpine and Alma Linux 8
        run: bash tools/smoke-static.sh target/x86_64-unknown-linux-musl/release/ox
      - name: ox serve behind a reverse proxy at a sub-path
        run: node tools/proxy-check.mjs target/x86_64-unknown-linux-musl/release/ox
      # the configurations docs/src/deploying.md shows, run as people run them
      - name: Install Apache, nginx, Caddy, Pound and Traefik
        run: |
          sudo apt-get install -y nginx apache2 caddy libssl-dev libpcre2-dev
          sudo systemctl stop nginx apache2 caddy || true
          # Ubuntu 24.04 has no Pound package: its own release, built
          curl -fsSL https://github.com/graygnuorg/pound/releases/download/v4.24/pound-4.24.tar.gz | tar xz -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/pound-4.24" && ./configure --quiet --prefix="$HOME/pound" && make -s -j4 && make -s install)
          echo "$HOME/pound/sbin" >> "$GITHUB_PATH"
          docker pull -q traefik:v3.1
          echo "127.0.0.1 intranet.test" | sudo tee -a /etc/hosts
          nginx -v; apache2 -v | head -1; caddy version; "$HOME/pound/sbin/pound" -V 2>&1 | head -1
      - name: ox serve behind each of them, at the root and a sub-path, with and without a token
        run: node tools/proxies/matrix.mjs target/x86_64-unknown-linux-musl/release/ox

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the image
        run: docker build -t oxrefine .
      - name: Run it and use it with its token
        run: |
          docker run -d --name ox -p 3300:3030 -e OXREFINE_TOKEN=docker-token oxrefine
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3300/healthz && break; sleep 1; done
          node -e 'import("./tools/serve-check.mjs").then(async (m) => console.log(await m.works("http://127.0.0.1:3300/", { token: "docker-token" })))'
          docker logs ox

  bench:
    name: Performance against the base build
    # the same runner builds both, so the comparison holds whatever the machine; a branch's first
    # push has no previous build to compare with
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build this change and the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo build --release --locked -p ox-cli
          git worktree add ../base "$BASE"
          CARGO_TARGET_DIR=../base-target cargo build --release --locked -p ox-cli --manifest-path ../base/Cargo.toml
      - name: Compare (fails on a clearly slower step or clearly more memory)
        run: node benchmarks/check.mjs --base ../base-target/release/ox 250000 1000000
