# Build and test on Windows, macOS and Linux: unit tests plus the OpenRefine conformance suites
# (GREL, operations, facets, import, sources, the messy-data corpus, exports), which compare against
# fixtures generated from OpenRefine 3.10.1 and committed under tests/. Then typecheck and build the UI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the desktop crate (ui/src-tauri) is not a default member; it needs the UI build and system WebView libraries
      - name: Build
        run: cargo build --release --locked
      - name: Tests and OpenRefine conformance
        run: cargo test --release --locked

  ui:
    name: UI typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Node regression tests
        run: node --test tests/*.test.mjs ../benchmarks/*.test.mjs ../tests/release/*.test.mjs ../tools/*.test.mjs
      - run: npm run build

  bench:
    name: Performance against the base build
    # the same runner builds both, so the comparison holds whatever the machine; a branch's first
    # push has no previous build to compare with
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build this change and the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo build --release --locked -p ox-cli
          git worktree add ../base "$BASE"
          CARGO_TARGET_DIR=../base-target cargo build --release --locked -p ox-cli --manifest-path ../base/Cargo.toml
      - name: Compare (fails on a clearly slower step or clearly more memory)
        run: node benchmarks/check.mjs --base ../base-target/release/ox 250000 1000000
