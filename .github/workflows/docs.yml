# The documentation site (docs/, mdBook) on GitHub Pages: https://ilyaux.github.io/OxRefine/
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/docs-grel.mjs", "ui/src/grel-docs.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the GREL reference is generated from OpenRefine's descriptions and OxRefine's function list
      - run: node tools/docs-grel.mjs
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
