<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">OxRefine — clean data, keep your workflow</title>
<desc id="hero-desc">An illustrative table of inconsistent city names passes through GREL, facets and clustering into consistent values. OxRefine is a Rust data-cleaning engine with reconciliation and undo history, available on desktop, in a browser and through the command line.</desc>
<style>
svg{--bg:#fff;--ink:#111113;--mute:#5f5f66;--rule:#e4e4e0;--ox:#1d4ed8;--wash:#eff4ff}
@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--rule:#30363d;--ox:#74a7ff;--wash:#15233c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:var(--mute)}.blue,.blue text{fill:var(--ox)}.bold{font-weight:600}.rule{fill:none;stroke:var(--rule)}.flow{fill:none;stroke:var(--ox);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.compact{display:none}
.trace{stroke-dasharray:9 7;animation:trace 3.8s ease-out 1}.settle,.settle text{animation:settle 3.4s ease-out 1}.meter{stroke-width:20}.compact .flow{stroke-width:4}.spill{stroke-width:12;transform-box:fill-box;transform-origin:left;animation:spill 3.8s cubic-bezier(.16,1,.3,1) 1}
@keyframes trace{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}@keyframes settle{0%,25%{fill:var(--ink)}70%,100%{fill:var(--ox)}}@keyframes spill{0%,28%{transform:scaleX(.12)}80%,100%{transform:scaleX(1)}}
@media(max-width:650px){.wide{display:none}.compact{display:inline}}
@media(prefers-reduced-motion:reduce){.trace,.settle,.settle text,.spill{animation:none}}
</style>
<rect width="1200" height="420" fill="var(--bg)"/><rect x=".5" y=".5" width="1199" height="419" class="rule"/>
<g class="wide">
<text x="48" y="86" font-size="57" class="bold" letter-spacing="-1.5">OxRefine</text>
<text x="50" y="124" font-size="24" class="muted">Clean data. Keep your workflow.</text>
<text x="1152" y="78" font-size="18" text-anchor="end" class="muted">Rust engine · desktop · browser · CLI</text>
<path d="M48 150H1152" class="rule"/>
<text x="48" y="184" font-size="18" class="bold">Messy inputs</text><text x="844" y="184" font-size="18" class="bold">Consistent values</text>
<rect x="48.5" y="202.5" width="308" height="120" class="rule"/><path d="M48 242H356M48 282H356M236 202V322" class="rule"/>
<g font-size="18" class="mono"><text x="64" y="230">nEw yOrK</text><text x="254" y="230">us</text><text x="64" y="270">New York</text><text x="254" y="270">USA</text><text x="64" y="310">NEW YORK</text><text x="254" y="310">U.S.</text></g>
<path d="M382 262H814M802 254L814 262L802 270" class="flow trace"/>
<text x="598" y="226" font-size="22" text-anchor="middle" class="bold">GREL · facets · clustering</text><text x="598" y="302" font-size="17" text-anchor="middle" class="muted">Review each change. Undo any step.</text>
<rect x="844" y="202" width="308" height="120" fill="var(--wash)"/><path d="M844 242H1152M844 282H1152M1032 202V322" class="rule"/>
<g font-size="18" class="mono blue settle"><text x="860" y="230">New York</text><text x="1050" y="230">US</text><text x="860" y="270">New York</text><text x="1050" y="270">US</text><text x="860" y="310">New York</text><text x="1050" y="310">US</text></g>
<text x="48" y="377" font-size="18" class="muted">Recipes · project history · Wikidata reconciliation · import and export</text><text x="1152" y="377" font-size="14" text-anchor="end" class="muted">Illustrative cleaning workflow</text>
</g>
<g class="compact"><text x="48" y="108" font-size="102" class="bold" letter-spacing="-2">OxRefine</text><text x="52" y="178" font-size="48" class="muted">Clean data. Keep your workflow.</text>
<g font-size="57" class="bold"><text x="52" y="285">Import</text><text x="482" y="285">Clean</text><text x="894" y="285">Export</text></g><path d="M278 266H425M407 254L425 266L407 278M685 266H835M817 254L835 266L817 278" class="flow trace" stroke-width="5"/>
<text x="52" y="364" font-size="39" class="muted">GREL · facets · clustering · undo history</text></g>
</svg>
