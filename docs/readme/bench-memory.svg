<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="bench-memory-title bench-memory-desc">
<title id="bench-memory-title">Peak resident memory</title>
<desc id="bench-memory-desc">Measured with PeakWorkingSet64. process resident high-water mark; excludes parent Node and OS overhead. No memory value is inferred for failed runs. 100,000 rows: OxRefine 24 MiB; OpenRefine 431 MiB. 250,000 rows: OxRefine 39 MiB; OpenRefine 852 MiB. 500,000 rows: OxRefine 64 MiB; OpenRefine 1,003 MiB. 1,000,000 rows: OxRefine 116 MiB; OpenRefine 1,433 MiB. 2,000,000 rows: OxRefine 220 MiB; OpenRefine out of memory. 3 repetitions, measured 2026-11-14T18:33:24.930Z. Java heap 1400M is configuration, not a resident-memory limit. Source: benchmarks/release-0.6.0/pre-fix-af937201/openrefine-1400M.json.</desc>
<metadata>{&quot;source&quot;:&quot;benchmarks/release-0.6.0/pre-fix-af937201/openrefine-1400M.json&quot;,&quot;sha256&quot;:&quot;7a93331da1700a78209d2a2807afc5ee2a31681230630e7c75fb6015d3ec61e3&quot;,&quot;when&quot;:&quot;2026-11-14T18:33:24.930Z&quot;,&quot;repetitions&quot;:3,&quot;statistic&quot;:&quot;median of each phase, median of per-run totals and median peak RSS&quot;,&quot;memoryMetric&quot;:&quot;PeakWorkingSet64&quot;,&quot;memoryUnit&quot;:&quot;MiB&quot;,&quot;memoryScope&quot;:&quot;process resident high-water mark; excludes parent Node and OS overhead&quot;,&quot;oxBinarySha256&quot;:&quot;af93720129ee5c9098ad3eb1d6e013b5af3088f4ea973f3469a27bceed01bc6c&quot;,&quot;openrefineMainSha256&quot;:&quot;b1bee728e85b4aa44967427707ecdb501a6b4aa3d87608ba7b29115c858f0957&quot;,&quot;recipeSha256&quot;:&quot;3a557b291666648df3141a5758b2be6b08448fb31e812f63e80fdeebb8456ddc&quot;,&quot;openrefine&quot;:&quot;3.10.1&quot;,&quot;javaHeap&quot;:&quot;1400M&quot;}</metadata>
<style>
svg{--bg:#fff;--ink:#111113;--mute:#5f5f66;--rule:#e4e4e0;--ox:#1d4ed8;--or:#686870;--warn:#99500a}
@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--rule:#30363d;--ox:#74a7ff;--or:#a4acb8;--warn:#efb44c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums}
.muted{fill:var(--mute)}.bold{font-weight:600}.blue{fill:var(--ox)}.gray{fill:var(--or)}.warn{fill:var(--warn)}.rule{fill:none;stroke:var(--rule)}.compact{display:none}
.bar{animation:measure 2.4s cubic-bezier(.16,1,.3,1) 1}
@keyframes measure{from{fill-opacity:.45}to{fill-opacity:1}}
@media(max-width:650px){.wide{display:none}.compact{display:inline}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
