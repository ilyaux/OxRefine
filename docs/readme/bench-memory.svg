="11" text-anchor="middle">64<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" dur="1.1s" fill="freeze"/></text><circle cx="288" cy="171.7" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.7s" fill="freeze"/></circle><text class="m" x="278" y="161.7" font-size="11" text-anchor="end">986<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.7s" fill="freeze"/></text><circle cx="492" cy="320.2" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.778;1" dur="1.35s" fill="freeze"/></circle><text class="m" x="492" y="308.2" font-size="11" text-anchor="middle">116<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.778;1" dur="1.35s" fill="freeze"/></text><circle cx="492" cy="97.7" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.846;1" dur="1.95s" fill="freeze"/></circle><text class="m" x="482" y="87.7" font-size="11" text-anchor="end">1,420<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.846;1" dur="1.95s" fill="freeze"/></text><circle cx="900" cy="302.5" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.813;1" dur="1.6s" fill="freeze"/></circle><text class="m" x="900" y="290.5" font-size="11" text-anchor="middle">220<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.813;1" dur="1.6s" fill="freeze"/></text>
