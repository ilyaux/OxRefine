<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Peak memory by table size: OxRefine stays under 220 MB, OpenRefine runs out of its heap at 2 million rows">
<title>Peak memory by table size: OxRefine stays under 220 MB, OpenRefine runs out of its heap at 2 million rows</title>
<style>
svg{--bg:#FFFFFF;--ink:#111113;--mute:#5F5F66;--rule:#E4E4E0;--ox:#1D4ED8;--ox2:#5B7FE6;--or:#9A9AA0;--or2:#C6C6CA;--warn:#B45309}
@media (prefers-color-scheme:dark){svg{--bg:#0D1117;--ink:#E6EDF3;--mute:#9198A1;--rule:#30363D;--ox:#4C8DFF;--ox2:#2B5CB8;--or:#7D8590;--or2:#484F58;--warn:#E3A008}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mute{fill:var(--mute)}.b{font-weight:600}.bg{fill:var(--bg)}
.ox{fill:var(--ox)}.ox2{fill:var(--ox2)}.or{fill:var(--or)}.or2{fill:var(--or2)}.warn{fill:var(--warn)}
.rule{stroke:var(--rule);fill:none}.ink{stroke:var(--ink)}
</style>
<rect class="bg" width="960" height="400"/>
<rect class="rule" x="0.5" y="0.5" width="959" height="399"/>

<text x="24" y="38" font-size="17" class="b">Peak memory</text>
<text x="24" y="60" font-size="12" class="mute">MB, whole workflow · every column is dictionary-encoded, so each distinct value is stored once</text>
<rect class="ox" x="700" y="28" width="12" height="12"/><text x="718" y="39" font-size="12">OxRefine</text>
<rect class="or" x="800" y="28" width="12" height="12"/><text x="818" y="39" font-size="12">OpenRefine</text>
<line class="rule" x1="84" x2="900" y1="340" y2="340"/><text class="m mute" x="74" y="344" font-size="11" text-anchor="end">0</text><line class="rule" x1="84" x2="900" y1="254.7" y2="254.7"/><text class="m mute" x="74" y="258.7" font-size="11" text-anchor="end">500</text><line class="rule" x1="84" x2="900" y1="169.3" y2="169.3"/><text class="m mute" x="74" y="173.3" font-size="11" text-anchor="end">1,000</text><line class="rule" x1="84" x2="900" y1="84" y2="84"/><text class="m mute" x="74" y="88" font-size="11" text-anchor="end">1,500</text><text class="m mute" x="84" y="362" font-size="11" text-anchor="middle">0</text><text class="m mute" x="288" y="362" font-size="11" text-anchor="middle">500k</text><text class="m mute" x="492" y="362" font-size="11" text-anchor="middle">1M</text><text class="m mute" x="696" y="362" font-size="11" text-anchor="middle">1.5M</text><text class="m mute" x="900" y="362" font-size="11" text-anchor="middle">2M</text>
<line x1="84" x2="900" y1="101.1" y2="101.1" stroke="var(--warn)" stroke-dasharray="6 4"/>
<text class="warn" x="92" y="93.1" font-size="11">OpenRefine default heap · 1,400 MB</text>
<path d="M124.8 268.5 L186 204 L288 174.1 L492 108.1" pathLength="1" fill="none" stroke="var(--or)" stroke-width="2.5" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;0" keyTimes="0;0.300;1" dur="2s" fill="freeze"/></path><path d="M492 108.1 L900 101.1" fill="none" stroke="var(--or)" stroke-width="2" stroke-dasharray="3 4"/>
<g stroke="var(--warn)" stroke-width="2.5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" dur="2.6999999999999997s" fill="freeze"/><line x1="893" y1="94.1" x2="907" y2="108.1"/><line x1="893" y1="108.1" x2="907" y2="94.1"/></g>
<text class="warn b" x="888" y="87.1" font-size="12" text-anchor="end">OpenRefine: out of memory<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" dur="2.6999999999999997s" fill="freeze"/></text><path d="M124.8 336.1 L186 333.7 L288 329.2 L492 320.2 L900 302.6" pathLength="1" fill="none" stroke="var(--ox)" stroke-width="2.5" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;0" keyTimes="0;0.000;1" dur="1.4s" fill="freeze"/></path><circle cx="124.8" cy="336.1" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.500;1" dur="0.6s" fill="freeze"/></circle><text class="m" x="124.8" y="324.1" font-size="11" text-anchor="middle">23<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.500;1" dur="0.6s" fill="freeze"/></text><circle cx="124.8" cy="268.5" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.750;1" dur="1.2s" fill="freeze"/></circle><text class="m" x="114.8" y="258.5" font-size="11" text-anchor="end">419<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.750;1" dur="1.2s" fill="freeze"/></text><circle cx="186" cy="333.7" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.647;1" dur="0.8500000000000001s" fill="freeze"/></circle><text class="m" x="186" y="321.7" font-size="11" text-anchor="middle">37<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.647;1" dur="0.8500000000000001s" fill="freeze"/></text><circle cx="186" cy="204" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.793;1" dur="1.45s" fill="freeze"/></circle><text class="m" x="176" y="194" font-size="11" text-anchor="end">797<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.793;1" dur="1.45s" fill="freeze"/></text><circle cx="288" cy="329.2" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" dur="1.1s" fill="freeze"/></circle><text class="m" x="288" y="317.2" font-size="11" text-anchor="middle">63<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" dur="1.1s" fill="freeze"/></text><circle cx="288" cy="174.1" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.7s" fill="freeze"/></circle><text class="m" x="278" y="164.1" font-size="11" text-anchor="end">972<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.7s" fill="freeze"/></text><circle cx="492" cy="320.2" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.778;1" dur="1.35s" fill="freeze"/></circle><text class="m" x="492" y="308.2" font-size="11" text-anchor="middle">116<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.778;1" dur="1.35s" fill="freeze"/></text><circle cx="492" cy="108.1" r="4" class="or"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.846;1" dur="1.95s" fill="freeze"/></circle><text class="m" x="482" y="98.1" font-size="11" text-anchor="end">1,359<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.846;1" dur="1.95s" fill="freeze"/></text><circle cx="900" cy="302.6" r="4" class="ox"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.813;1" dur="1.6s" fill="freeze"/></circle><text class="m" x="900" y="290.6" font-size="11" text-anchor="middle">219<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.813;1" dur="1.6s" fill="freeze"/></text>
<text class="mute" x="900" y="384" font-size="11" text-anchor="end">rows</text>
</svg>
