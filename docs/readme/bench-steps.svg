<svg xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img" aria-label="Each step at 1,000,000 rows on a log scale, OxRefine against OpenRefine">
<title>Each step at 1,000,000 rows on a log scale, OxRefine against OpenRefine</title>
<style>
svg{--bg:#FFFFFF;--ink:#111113;--mute:#5F5F66;--rule:#E4E4E0;--ox:#1D4ED8;--ox2:#5B7FE6;--or:#9A9AA0;--or2:#C6C6CA;--warn:#B45309}
