.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mute{fill:var(--mute)}.b{font-weight:600}.bg{fill:var(--bg)}
.ox{fill:var(--ox)}.ox2{fill:var(--ox2)}.or{fill:var(--or)}.or2{fill:var(--or2)}.warn{fill:var(--warn)}
.rule{stroke:var(--rule);fill:none}
</style>
<rect class="bg" width="960" height="354"/>
<rect class="rule" x="0.5" y="0.5" width="959" height="353"/>

<text x="24" y="38" font-size="17" class="b">Each step at 1,000,000 rows</text>
<text x="24" y="60" font-size="12" class="mute">log scale · median of 3 runs · facets, clustering and recipes work once per distinct value</text>
