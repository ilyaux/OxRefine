<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="bench-steps-title bench-steps-desc">
<title id="bench-steps-title">Time spent in each step</title>
<desc id="bench-steps-desc">Each phase is measured independently at 1,000,000 rows. Each step has its own linear scale; phase medians need not sum to the median workflow total. Import: OxRefine 373.66 ms; OpenRefine 1.48 s. Text facet: OxRefine 6.81 ms; OpenRefine 646.19 ms. Clustering: OxRefine 8.46 ms; OpenRefine 1.75 s. Recipe: OxRefine 33.33 ms; OpenRefine 9.72 s. Export: OxRefine 235.53 ms; OpenRefine 1.43 s. 3 repetitions, measured 2026-11-14T19:35:57.437Z. Java heap 1400M is configuration, not a resident-memory limit. Source: benchmarks/release-0.6.0/openrefine-1400M.json.</desc>
