<title id="bench-steps-title">Time spent in each step</title>
<desc id="bench-steps-desc">Each phase is measured independently at 1,000,000 rows. Each step has its own linear scale; phase medians need not sum to the median workflow total. Import: OxRefine 340.35 ms; OpenRefine 1.92 s. Text facet: OxRefine 14.44 ms; OpenRefine 532.42 ms. Clustering: OxRefine 20.17 ms; OpenRefine 1.51 s. Recipe: OxRefine 64.23 ms; OpenRefine 7.44 s. Export: OxRefine 195.51 ms; OpenRefine 1.19 s. 3 repetitions, measured 2026-11-14T18:33:24.930Z. Java heap 1400M is configuration, not a resident-memory limit. Source: benchmarks/release-0.6.0/pre-fix-af937201/openrefine-1400M.json.</desc>
