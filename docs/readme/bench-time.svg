ur="1.26s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="150.9" y="283" font-size="12">0.60 s <tspan class="mute">· 116 MB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.717;1" dur="1.06s" fill="freeze"/></text><rect class="or" x="120" y="290" width="640" height="16"><animate attributeName="width" values="0;0;640" keyTimes="0;0.242;1" dur="2.1100000000000003s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="768" y="303" font-size="12">16.8 s <tspan class="mute">· 1,359 MB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.867;1" dur="2.26s" fill="freeze"/></text><text class="m b" x="936" y="293" font-size="16" text-anchor="end">28×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.873;1" dur="2.36s" fill="freeze"/></text><text class="m b" x="24" y="351" font-size="13">2M rows</text><rect class="ox" x="120" y="328" width="44.4" height="16"><animate attributeName="width" values="0;0;44.4" keyTimes="0;0.348;1" dur="1.38s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="172.4" y="341" font-size="12">1.2 s <tspan class="mute">· 219 MB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.746;1" dur="1.18s" fill="freeze"/></text><rect x="120" y="348" width="640" height="16" fill="none" stroke="var(--warn)" stroke-dasharray="4 3"/><text class="warn" x="130" y="360" font-size="12">OpenRefine ran out of memory (1,400 MB heap)</text>
</svg>
