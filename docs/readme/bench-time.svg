<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="bench-time-title bench-time-desc">
<title id="bench-time-title">Measured workflow time</title>
<desc id="bench-time-desc">Median of per-run workflow totals; excludes process startup, data generation and output validation. Completed pairs have identical exported values. 100,000 rows: OxRefine 90.29 ms; OpenRefine 1.75 s. 250,000 rows: OxRefine 146.94 ms; OpenRefine 3.4 s. 500,000 rows: OxRefine 283.11 ms; OpenRefine 5.91 s. 1,000,000 rows: OxRefine 657.79 ms; OpenRefine 15.02 s. 2,000,000 rows: OxRefine 1.38 s; OpenRefine out of memory. 3 repetitions, measured 2026-11-14T19:35:57.437Z. Java heap 1400M is configuration, not a resident-memory limit. Source: benchmarks/release-0.6.0/openrefine-1400M.json.</desc>
<metadata>{&quot;source&quot;:&quot;benchmarks/release-0.6.0/openrefine-1400M.json&quot;,&quot;sha256&quot;:&quot;4e857a9e3ee950e07f7e692ca7810232d2f11d83b07480bd3d890fbb9e1beb04&quot;,&quot;when&quot;:&quot;2026-11-14T19:35:57.437Z&quot;,&quot;repetitions&quot;:3,&quot;statistic&quot;:&quot;median of each phase, median of per-run totals and median peak RSS&quot;,&quot;memoryMetric&quot;:&quot;PeakWorkingSet64&quot;,&quot;memoryUnit&quot;:&quot;MiB&quot;,&quot;memoryScope&quot;:&quot;process resident high-water mark; excludes parent Node and OS overhead&quot;,&quot;oxBinarySha256&quot;:&quot;31e9e0d1a177f74b895475dda821928aeecb5b649fe4ead3b0676b7a1f158cd9&quot;,&quot;openrefineMainSha256&quot;:&quot;b1bee728e85b4aa44967427707ecdb501a6b4aa3d87608ba7b29115c858f0957&quot;,&quot;recipeSha256&quot;:&quot;3a557b291666648df3141a5758b2be6b08448fb31e812f63e80fdeebb8456ddc&quot;,&quot;openrefine&quot;:&quot;3.10.1&quot;,&quot;javaHeap&quot;:&quot;1400M&quot;}</metadata>
<style>
svg{--bg:#fff;--ink:#111113;--mute:#5f5f66;--rule:#e4e4e0;--ox:#1d4ed8;--or:#686870;--warn:#99500a}
@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--rule:#30363d;--ox:#74a7ff;--or:#a4acb8;--warn:#efb44c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums}
.muted{fill:var(--mute)}.bold{font-weight:600}.blue{fill:var(--ox)}.gray{fill:var(--or)}.warn{fill:var(--warn)}.rule{fill:none;stroke:var(--rule)}.compact{display:none}
.bar{animation:measure 2.4s cubic-bezier(.16,1,.3,1) 1}
@keyframes measure{from{fill-opacity:.45}to{fill-opacity:1}}
@media(max-width:650px){.wide{display:none}.compact{display:inline}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
