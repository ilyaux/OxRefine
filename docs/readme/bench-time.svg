<svg xmlns="http://www.w3.org/2000/svg" width="960" height="426" viewBox="0 0 960 426" role="img" aria-label="Whole-workflow time and peak memory by table size, OxRefine against OpenRefine">
<title>Whole-workflow time and peak memory by table size, OxRefine against OpenRefine</title>
<style>
svg{--bg:#FFFFFF;--ink:#111113;--mute:#5F5F66;--rule:#E4E4E0;--ox:#1D4ED8;--ox2:#5B7FE6;--or:#9A9AA0;--or2:#C6C6CA;--warn:#B45309}
@media (prefers-color-scheme:dark){svg{--bg:#0D1117;--ink:#E6EDF3;--mute:#9198A1;--rule:#30363D;--ox:#4C8DFF;--ox2:#2B5CB8;--or:#7D8590;--or2:#484F58;--warn:#E3A008}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mute{fill:var(--mute)}.b{font-weight:600}.bg{fill:var(--bg)}
.ox{fill:var(--ox)}.ox2{fill:var(--ox2)}.or{fill:var(--or)}.or2{fill:var(--or2)}.warn{fill:var(--warn)}
.rule{stroke:var(--rule);fill:none}.ink{stroke:var(--ink)}
</style>
<rect class="bg" width="960" height="426"/>
<rect class="rule" x="0.5" y="0.5" width="959" height="425"/>

<text x="24" y="38" font-size="17" class="b">Whole workflow, wall-clock</text>
<text x="24" y="60" font-size="12" class="mute">import + text facet + clustering + 5-step recipe + export, fresh process each run · lower is better</text>
<rect class="ox" x="700" y="28" width="12" height="12"/><text x="718" y="39" font-size="12">OxRefine</text>
<rect class="or" x="800" y="28" width="12" height="12"/><text x="818" y="39" font-size="12">OpenRefine</text>
<line class="rule" x1="120" x2="120" y1="84" y2="382"/><text class="m mute" x="120" y="400" font-size="11" text-anchor="middle">0 s</text><line class="rule" x1="309.9" x2="309.9" y1="84" y2="382"/><text class="m mute" x="309.9" y="400" font-size="11" text-anchor="middle">5 s</text><line class="rule" x1="499.9" x2="499.9" y1="84" y2="382"/><text class="m mute" x="499.9" y="400" font-size="11" text-anchor="middle">10 s</text><line class="rule" x1="689.8" x2="689.8" y1="84" y2="382"/><text class="m mute" x="689.8" y="400" font-size="11" text-anchor="middle">15 s</text><text class="m b" x="24" y="119" font-size="13">100k rows</text><rect class="ox" x="120" y="96" width="4.2" height="16"><animate attributeName="width" values="0;0;4.2" keyTimes="0;0.000;1" dur="0.9s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="132.2" y="109" font-size="12">0.11 s <tspan class="mute">· 23 MB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="0.7s" fill="freeze"/></text><rect class="or" x="120" y="116" width="81.6" height="16"><animate attributeName="width" values="0;0;81.6" keyTimes="0;0.086;1" dur="1.75s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="209.6" y="129" font-size="12">2.1 s <tspan class="mute">· 419 MB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" dur="1.9000000000000001s" fill="freeze"/></text><text class="m b" x="936" y="119" font-size="16" text-anchor="end">19×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.850;1" dur="2s" fill="freeze"/></text><text class="m b" x="24" y="177" font-size="13">250k rows</text><rect class="ox" x="120" y="154" width="7.6" height="16"><animate attributeName="width" values="0;0;7.6" keyTimes="0;0.118;1" dur="1.02s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="135.6" y="167" font-size="12">0.20 s <tspan class="mute">· 37 MB</tspan