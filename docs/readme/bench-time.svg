<svg xmlns="http://www.w3.org/2000/svg" width="960" height="426" viewBox="0 0 960 426" role="img" aria-label="Whole-workflow time and peak memory by table size, OxRefine against OpenRefine">
<title>Whole-workflow time and peak memory by table size, OxRefine against OpenRefine</title>
<style>
svg{--bg:#FFFFFF;--ink:#111113;--mute:#5F5F66;--rule:#E4E4E0;--ox:#1D4ED8;--ox2:#5B7FE6;--or:#9A9AA0;--or2:#C6C6CA;--warn:#B45309}
@media (prefers-color-scheme:dark){svg{--bg:#0D1117;--ink:#E6EDF3;--mute:#9198A1;--rule:#30363D;--ox:#4C8DFF;--ox2:#2B5CB8;--or:#7D8590;--or2:#484F58;--warn:#E3A008}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mute{fill:var(--mute)}.b{font-weight:600}.bg{fill:var(--bg)}
.ox{fill:var(--ox)}.ox2{fill:var(--ox2)}.or{fill:var(--or)}.or2{fill:var(--or2)}.warn{fill:var(--warn)}
.rule{stroke:var(--rule);fill:none}
</style>
<rect class="bg" width="960" height="426"/>
<rect class="rule" x="0.5" y="0.5" width="959" height="425"/>

<text x="24" y="38" font-size="17" class="b">Whole workflow, wall-clock</text>
<text x="24" y="60" font-size="12" class="mute">import + text facet + clustering + 5-step recipe + export · median of 3 runs · lower is better</text>
<rect class="ox" x="700" y="28" width="12" height="12"/><text x="718" y="39" font-size="12">OxRefine</text>
<rect class="or" x="800" y="28" width="12" height="12"/><text x="818" y="39" font-size="12">OpenRefine</text>
<line class="rule" x1="120" x2="120" y1="84" y2="382"/><text class="m mute" x="120" y="400" font-size="11" text-anchor="middle">0 s</text><line class="rule" x1="333" x2="333" y1="84" y2="382"/><text class="m mute" x="333" y="400" font-size="11" text-anchor="middle">5 s</text><line class="rule" x1="546.1" x2="546.1" y1="84" y2="382"/><text class="m mute" x="546.1" y="400" font-size="11" text-anchor="middle">10 s</text><line class="rule" x1="759.1" x2="759.1" y1="84" y2="382"/><text class="m mute" x="759.1" y="400" font-size="11" text-anchor="middle">15 s</text><text class="m b" x="24" y="119" font-size="13">100k rows</text><rect class="ox" x="120" y="96" width="3.8" height="16"><animate attributeName="width" values="0;0;3.8" keyTimes="0;0.000;1" dur="0.9s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="131.8" y="109" font-size="12">90 ms <tspan class="mute">· 24 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="0.7s" fill="freeze"/></text><rect class="or" x="120" y="116" width="74.7" height="16"><animate attributeName="width" values="0;0;74.7" keyTimes="0;0.086;1" dur="1.75s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="202.7" y="129" font-size="12">1.75 s <tspan class="mute">· 460 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" dur="1.9000000000000001s" fill="freeze"/></text><text class="m b" x="936" y="119" font-size="16" text-anchor="end">19×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.850;1" dur="2s" fill="freeze"/></text><text class="m b" x="24" y="177" font-size="13">250k rows</text><rect class="ox" x="120" y="154" width="6.3" height="16"><animate attributeName="width" values="0;0;6.3" keyTimes="0;0.118;1" dur="1.02s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="134.3" y="167" font-size="12">0.15 s <tspan class="mute">· 38 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.634;1" dur="0.8200000000000001s" fill="freeze"/></text><rect class="or" x="120" y="174" width="144.9" height="16"><animate attributeName="width" values="0;0;144.9" keyTimes="0;0.144;1" dur="1.87s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="272.9" y="187" font-size="12">3.40 s <tspan class="mute">· 820 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.851;1" dur="2.02s" fill="freeze"/></text><text class="m b" x="936" y="177" font-size="16" text-anchor="end">23×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.858;1" dur="2.1199999999999997s" fill="freeze"/></text><text class="m b" x="24" y="235" font-size="13">500k rows</text><rect class="ox" x="120" y="212" width="12.1" height="16"><animate attributeName="width" values="0;0;12.1" keyTimes="0;0.211;1" dur="1.1400000000000001s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="140.1" y="225" font-size="12">0.28 s <tspan class="mute">· 64 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.681;1" dur="0.94s" fill="freeze"/></text><rect class="or" x="120" y="232" width="251.7" height="16"><animate attributeName="width" values="0;0;251.7" keyTimes="0;0.196;1" dur="1.9900000000000002s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="379.7" y="245" font-size="12">5.91 s <tspan class="mute">· 986 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.860;1" dur="2.14s" fill="freeze"/></text><text class="m b" x="936" y="235" font-size="16" text-anchor="end">21×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.866;1" dur="2.2399999999999998s" fill="freeze"/></text><text class="m b" x="24" y="293" font-size="13">1M rows</text><rect class="ox" x="120" y="270" width="28" height="16"><animate attributeName="width" values="0;0;28" keyTimes="0;0.286;1" dur="1.26s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="156" y="283" font-size="12">0.66 s <tspan class="mute">· 116 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.717;1" dur="1.06s" fill="freeze"/></text><rect class="or" x="120" y="290" width="640" height="16"><animate attributeName="width" values="0;0;640" keyTimes="0;0.242;1" dur="2.1100000000000003s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="768" y="303" font-size="12">15.0 s <tspan class="mute">· 1,420 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.867;1" dur="2.26s" fill="freeze"/></text><text class="m b" x="936" y="293" font-size="16" text-anchor="end">23×<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.873;1" dur="2.36s" fill="freeze"/></text><text class="m b" x="24" y="351" font-size="13">2M rows</text><rect class="ox" x="120" y="328" width="58.9" height="16"><animate attributeName="width" values="0;0;58.9" keyTimes="0;0.348;1" dur="1.38s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="m" x="186.9" y="341" font-size="12">1.38 s <tspan class="mute">· 220 MiB</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.746;1" dur="1.18s" fill="freeze"/></text><rect x="120" y="348" width="640" height="16" fill="none" stroke="var(--warn)" stroke-dasharray="4 3"/><text class="warn" x="130" y="360" font-size="12">OpenRefine ran out of memory (1,400 MB heap)</text>
</svg>
