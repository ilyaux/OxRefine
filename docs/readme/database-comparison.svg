<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="database-title database-desc">
<title id="database-title">Database import time and memory comparison</title>
<desc id="database-desc">PostgreSQL: OxRefine 155.1 ms, 22 MiB; OpenRefine 707.7 ms, 322 MiB; 4.6× faster, 14.6× lower peak. MySQL: OxRefine 113.8 ms, 22 MiB; OpenRefine 1,294.2 ms, 357 MiB; 11.4× faster, 16.2× lower peak. MariaDB: OxRefine 117.7 ms, 21 MiB; OpenRefine 753.2 ms, 317 MiB; 6.4× faster, 15.1× lower peak. SQLite: OxRefine 121.3 ms, 23 MiB; OpenRefine not measured: bundled SQLite JDBC registration failed. OxRefine import includes SQL fetch, typed snapshot and project save. OpenRefine import ends when its native database controller registers the project in memory; no autosave, export or archive creation is charged to import. These are native import paths, not identical durability guarantees. Backend process OS high-water mark at import completion, including startup/runtime overhead; excludes database servers, browser, parent Node and external filesystem cache. JVM -Xms256M -Xmx1400M; heap configuration is not a process RAM limit. Source: benchmarks/release-0.6.0/database-comparison.json.</desc>
<metadata>{&quot;path&quot;:&quot;benchmarks/release-0.6.0/database-comparison.json&quot;,&quot;sha256&quot;:&quot;847f2d5e6e1d5c9f0d0a3b6885d1ec70bae620518a72b8031cab9c7e9f97530a&quot;,&quot;when&quot;:&quot;2026-11-15T00:35:06.256Z&quot;,&quot;statistic&quot;:&quot;median of raw repetitions; ratios are ratios of medians&quot;,&quot;oxBinarySha256&quot;:&quot;31e9e0d1a177f74b895475dda821928aeecb5b649fe4ead3b0676b7a1f158cd9&quot;,&quot;openrefineMainSha256&quot;:&quot;b1bee728e85b4aa44967427707ecdb501a6b4aa3d87608ba7b29115c858f0957&quot;,&quot;openrefineDatabaseSha256&quot;:&quot;ff9b36b43e14d5fb842003866d042286298b621a9fc7a01444e1ae5997a80c67&quot;,&quot;memoryMetric&quot;:&quot;PeakWorkingSet64&quot;}</metadata>
