<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="compat-title compat-desc">
<title id="compat-title">Compatibility checked against real OpenRefine output</title>
<desc id="compat-desc">The same inputs and recipes run through OpenRefine 3.10.1 and OxRefine. Reference fixtures compare values, operations and project history. Known differences are documented; this diagram does not claim every behavior is identical.</desc>
<style>
svg{--bg:#fff;--ink:#111113;--mute:#5f5f66;--rule:#e4e4e0;--ox:#1d4ed8;--wash:#eff4ff}
@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--rule:#30363d;--ox:#74a7ff;--wash:#15233c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:var(--mute)}.blue,.blue text{fill:var(--ox)}.bold{font-weight:600}.rule{fill:none;stroke:var(--rule)}.flow{fill:none;stroke:var(--ox);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.compact{display:none}
.trace{stroke-dasharray:9 7;animation:trace 3.8s ease-out 1}.settle,.settle text{animation:settle 3.4s ease-out 1}.meter{stroke-width:20}.compact .flow{stroke-width:4}.spill{stroke-width:12;transform-box:fill-box;transform-origin:left;animation:spill 3.8s cubic-bezier(.16,1,.3,1) 1}
@keyframes trace{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}@keyframes settle{0%,25%{fill:var(--ink)}70%,100%{fill:var(--ox)}}@keyframes spill{0%,28%{transform:scaleX(.12)}80%,100%{transform:scaleX(1)}}
@media(max-width:650px){.wide{display:none}.compact{display:inline}}
@media(prefers-reduced-motion:reduce){.trace,.settle,.settle text,.spill{animation:none}}
</style>
<rect width="1200" height="420" fill="var(--bg)"/><rect x=".5" y=".5" width="1199" height="419" class="rule"/>
<g class="wide">
<text x="48" y="66" font-size="34" class="bold">Compatibility you can check</text><text x="48" y="102" font-size="20" class="muted">Fixtures come from running real OpenRefine 3.10.1.</text><path d="M48 130H1152" class="rule"/>
<text x="48" y="182" font-size="22" class="bold">The same work</text><text x="48" y="224" font-size="20" class="mono">input + recipe</text><text x="48" y="258" font-size="18" class="muted">or a saved project</text>
<path d="M282 224H342V182H400M342 224V280H400" class="flow trace"/><text x="422" y="189" font-size="22">OpenRefine 3.10.1</text>
<rect x="400" y="248" width="310" height="58" fill="var(--wash)"/><text x="422" y="285" font-size="23" class="bold blue">OxRefine</text>
<path d="M710 182H776V224H830M710 278H776V224M818 216L830 224L818 232" class="flow trace"/><text x="852" y="208" font-size="22" class="bold">Compare results</text><text x="852" y="244" font-size="18" class="muted">Values · operations · history</text>
<path d="M48 338H1152" class="rule"/><text x="48" y="378" font-size="19" class="muted">Known differences stay explicit, with their reasons and reference cases.</text>
</g>
<g class="compact"><text x="48" y="93" font-size="66" class="bold">Compatibility you can check</text><text x="52" y="169" font-size="43" class="muted">Real OpenRefine 3.10.1 reference outputs</text><text x="52" y="266" font-size="53" class="bold">Same input. Compare values and history.</text><path d="M52 308H1148" class="flow trace" stroke-width="4"/><text x="52" y="371" font-size="43" class="muted">Known differences are documented.</text></g>
</svg>
