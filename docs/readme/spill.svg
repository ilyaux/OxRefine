<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="50,000,001 rows under a 1,024 MiB memory limit, 0 out-of-memory kills">
<title>50,000,001 rows under a 1,024 MiB memory limit, 0 out-of-memory kills</title>
<style>
svg{--bg:#FFFFFF;--ink:#111113;--mute:#5F5F66;--rule:#E4E4E0;--ox:#1D4ED8;--ox2:#5B7FE6;--or:#9A9AA0;--or2:#C6C6CA;--warn:#B45309}
@media (prefers-color-scheme:dark){svg{--bg:#0D1117;--ink:#E6EDF3;--mute:#9198A1;--rule:#30363D;--ox:#4C8DFF;--ox2:#2B5CB8;--or:#7D8590;--or2:#484F58;--warn:#E3A008}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mute{fill:var(--mute)}.b{font-weight:600}.bg{fill:var(--bg)}
.ox{fill:var(--ox)}.ox2{fill:var(--ox2)}.or{fill:var(--or)}.or2{fill:var(--or2)}.warn{fill:var(--warn)}
.rule{stroke:var(--rule);fill:none}
</style>
<rect class="bg" width="960" height="250"/>
<rect class="rule" x="0.5" y="0.5" width="959" height="249"/>

<text x="24" y="38" font-size="17" class="b">Bigger than memory (experimental)</text>
<text x="24" y="60" font-size="12" class="mute">import, transform, undo, export and reopen, every row checked · Linux cgroup with a 1 GiB limit · OXREFINE_CODE_BUDGET_MIB=64</text>
<text x="24" y="112" font-size="30" class="m b" letter-spacing="-1">50,000,001<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="0.3s" fill="freeze"/></text><text class="mute" x="26" y="134" font-size="12">rows, 20 columns</text><text x="252" y="112" font-size="30" class="m b" letter-spacing="-1">3.6 GB<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.44999999999999996s" fill="freeze"/></text><text class="mute" x="254" y="134" font-size="12">CSV on disk</text><text x="480" y="112" font-size="30" class="m b" letter-spacing="-1">924 MiB<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.500;1" dur="0.6s" fill="freeze"/></text><text class="mute" x="482" y="134" font-size="12">OxRefine resident peak</text><text x="708" y="112" font-size="30" class="m b" letter-spacing="-1">0<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.600;1" dur="0.75s" fill="freeze"/></text><text class="mute" x="710" y="134" font-size="12">out-of-memory kills</text><text x="24" y="178" font-size="12" class="b">Row codes: 4.0 GB</text><text class="mute" x="936" y="178" font-size="12" text-anchor="end">memory limit 1,024 MiB, no swap</text><rect class="rule" x="24" y="188" width="912" height="18"/><rect class="or2" x="24" y="188" width="912" height="18"><animate attributeName="width" values="0;0;912" keyTimes="0;0.143;1" dur="1.4s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><rect class="ox" x="24" y="188" width="244.8" height="18"><animate attributeName="width" values="0;0;244.8" keyTimes="0;0.429;1" dur="1.4s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" fill="freeze"/></rect><text class="mute" x="24" y="228" font-size="11">blue: what fits in the memory limit · the rest of the row codes live in temporary files and come back as they’re needed</text>
</svg>
