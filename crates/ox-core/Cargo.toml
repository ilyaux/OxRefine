[package]
name = "ox-core"
version = "0.7.2"
edition = "2021"

[dependencies]
base64 = "0.22"
bigdecimal = "0.4"
calamine = { version = "0.38", features = ["chrono"] }
cfb = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.3"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
hashbrown = { version = "0.17", default-features = false }
libm = "0.2"
bzip2 = "0.6"
md-5 = "0.10"
memmap2 = "0.9"
parse_wiki_text = "=0.1.5"
regex = "1"
rphonetic = "4"
rust_xlsxwriter = { version = "0.94", default-features = false }
rustc-hash = "2"
# Python expressions. Cargo.lock pins malachite-bigint 0.9.2, mt19937 3.1.0 and libc 0.2.186: newer ones break
# rustpython 0.5.0 (libc 0.2.187+ makes POSIX_SPAWN_* a c_short on Linux).
rustpython-pylib = { version = "=0.5.0", features = ["freeze-stdlib"] }
rustpython-stdlib = "=0.5.0"
rustpython-vm = { version = "=0.5.0", features = ["freeze-stdlib"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql", "chrono", "bigdecimal", "json"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "net"] }
unicode-normalization = "0.1"
ureq = "3.5.1"
quick-xml = "0.42"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
