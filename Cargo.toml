[workspace]
resolver = "2"
members = ["crates/ox-core", "crates/ox-cli", "ui/src-tauri"]
default-members = ["crates/ox-core", "crates/ox-cli"]

[profile.release]
codegen-units = 1
lto = "thin"

# Keep optimized test execution without repeating whole-program LTO for every test binary.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
